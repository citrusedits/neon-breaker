<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON BREAKER</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif;
    background:linear-gradient(135deg,#050410 0%,#0a0818 60%,#050410 100%); }
  #wrap { position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center; }
  #stage { display:flex; flex-direction:column; align-items:flex-end; }
  #hudbtns { display:flex; gap:12px; margin-bottom:12px; padding-right:4px; }
  #hudbtns button { width:44px; height:36px; border-radius:3px; font-size:17px;
    background:rgba(10,8,20,.6); border:1px solid rgba(100,130,145,.35); color:#c8d4e0;
    cursor:pointer; -webkit-tap-highlight-color:rgba(255,95,31,.25); }
  #hudbtns button:active {
    background:#FF8A00; border-color:#FF8A00; color:#0b0a12;
    box-shadow:0 0 14px rgba(255,95,31,.5); }
  canvas { display:block; border-radius:8px;
    box-shadow:0 0 40px rgba(255,95,31,.12), 0 0 70px rgba(0,0,0,.5);
    touch-action:none; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; background:rgba(4,3,12,.78); backdrop-filter:blur(5px);
    padding:10px; z-index:3; }
  #panel { position:relative; text-align:center; color:#c8d4e0; padding:26px 5vw;
    border:1px solid rgba(100,130,145,.35); border-radius:8px;
    background:rgba(10,8,20,.82);
    box-shadow:0 0 50px rgba(0,0,0,.55);
    width:min(94vw,620px); max-height:94vh; overflow-y:auto; }
  #panel h2 { font-size:clamp(22px,6vw,38px); color:#e8f0f8; text-shadow:none;
    margin-bottom:8px; white-space:normal; letter-spacing:4px;
    border-bottom:1px solid rgba(100,130,145,.35); padding-bottom:10px; }
  #panel h2.win  { color:#7f5; }
  #panel h2.lose { color:#f4a; }
  .meta { font-size:clamp(14px,3.4vw,17px); color:#8ab4d8; margin-bottom:14px; }
  .meta b { color:#FF8A00; }
  .btn { display:inline-block; padding:11px 24px; border-radius:3px;
    background:rgba(10,8,20,.45); border:1px solid rgba(100,130,145,.35);
    color:#c8d4e0; font-family:monospace; letter-spacing:2px;
    text-transform:uppercase; cursor:pointer; transition:.15s;
    margin:5px 3px; font-size:clamp(13px,3.3vw,16px);
    -webkit-tap-highlight-color:rgba(255,95,31,.25); }
  .btn:hover:not(:disabled) { border-color:#FF5F1F; color:#fff; }
  .btn:active:not(:disabled) {
    background:#FF8A00; border-color:#FF8A00; color:#0b0a12;
    box-shadow:0 0 14px rgba(255,95,31,.5); transition:none; }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.on, .btn.sel { background:#FF8A00; border-color:#FF8A00; color:#0b0a12;
    box-shadow:0 0 14px rgba(255,95,31,.5); }
  .btn.primary { background:#FF8A00; border-color:#FF8A00; color:#0b0a12;
    font-weight:bold; box-shadow:0 0 14px rgba(255,95,31,.35); }
  .btn.primary:hover:not(:disabled) { background:#ff9d33;
    box-shadow:0 0 22px rgba(255,95,31,.6); transform:scale(1.02); }
  .row { text-align:center; margin-bottom:10px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:6px; margin:10px 0; }
  .small { font-size:clamp(11px,2.7vw,13px); color:#7d8fa8; margin-top:12px; }
  .credit { background:rgba(10,8,20,.7);
    border:1px solid rgba(100,130,145,.35);
    border-radius:3px;
    padding:10px 18px;
    font-size:clamp(12px,3vw,14px); color:#9fc6d8;
    margin-top:22px; letter-spacing:.5px;
    box-shadow:none; }
  .credit a { display:flex; align-items:center; justify-content:center; gap:9px;
    color:inherit; text-decoration:none; -webkit-tap-highlight-color:rgba(255,95,31,.2); }
  .credit a:active { box-shadow:0 0 18px rgba(255,95,31,.35); border-radius:3px; }
  .credit img { width:22px; height:22px; display:block; }
  .tgmark { display:inline-block; width:22px; height:22px; vertical-align:middle;
    background:#2AABEE; border-radius:50%; text-align:center; line-height:22px;
    color:#fff; font-size:13px; font-weight:bold; }
  .shopgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:8px; margin:10px 0; }
  .shopgrid button { font-size:13px; padding:10px 8px; border-radius:3px;
    border:1px solid rgba(100,130,145,.35);
    color:#c8d4e0; background:rgba(10,8,20,.45); cursor:pointer; }
  .shopgrid button.own { color:#8f8; border-color:rgba(140,255,140,.45); }
  .shopgrid button.eq  { color:#0b0a12; border-color:#FF8A00; background:#FF8A00;
    box-shadow:0 0 14px rgba(255,95,31,.5); }
  .shopgrid .cost { display:block; font-size:11px; color:#FF8A00; margin-top:4px; }
  .achlist { text-align:left; margin:10px auto; max-width:420px; }
  .ach { padding:7px 12px; border-left:3px solid rgba(100,130,145,.3); margin:6px 0;
    background:rgba(255,255,255,.03); border-radius:0 3px 3px 0; font-size:14px; }
  .ach.done { border-left-color:#FF8A00; color:#ffe4c4; }
  .ach .d { display:block; font-size:12px; color:#7d8fa8; }
  .diffcol { display:flex; flex-direction:column; gap:8px;
    max-width:340px; margin:12px auto; }
  .diffcol button { padding:12px 10px; border-radius:3px; font-family:monospace;
    font-size:15px; letter-spacing:2px; text-transform:uppercase;
    border:1px solid rgba(100,130,145,.35); color:#c8d4e0;
    background:rgba(10,8,20,.45); cursor:pointer; }
  .diffcol button:active {
    background:#FF8A00; border-color:#FF8A00; color:#0b0a12;
    box-shadow:0 0 14px rgba(255,95,31,.5); transition:none; }
  .diffcol button.cur { background:#FF8A00; border-color:#FF8A00; color:#0b0a12;
    box-shadow:0 0 14px rgba(255,95,31,.5); }
  .diffcol .d { display:block; font-size:11px; text-transform:none;
    letter-spacing:0; margin-top:5px; color:inherit; opacity:.75; }
  input[type="range"] { width:100%; max-width:280px; height:30px;
    accent-color:#FF8A00; cursor:pointer; }
  .profName { font-family:monospace; letter-spacing:1px; }
  .avgrid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px;
    margin:8px auto; max-width:300px; }
  .avgrid button { font-size:22px; padding:8px 0; border-radius:3px;
    border:1px solid rgba(100,130,145,.35); background:rgba(10,8,20,.45);
    cursor:pointer; }
  .avgrid button.cur { background:#FF8A00; border-color:#FF8A00;
    box-shadow:0 0 14px rgba(255,95,31,.5); }
  .cgrid { display:grid; grid-template-columns:repeat(8,1fr); gap:6px;
    margin:8px auto; max-width:300px; }
  .cgrid button { height:34px; border-radius:3px; border:2px solid rgba(100,130,145,.35);
    cursor:pointer; }
  .cgrid button.cur { border-color:#fff; box-shadow:0 0 10px rgba(255,255,255,.4); }
  #toast { position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(10,8,20,.9); border:1px solid #FF5F1F;
    color:#ffd9b8; padding:10px 22px; border-radius:3px; font-size:14px;
    box-shadow:0 0 20px rgba(255,95,31,.3); z-index:10; opacity:0;
    transition:opacity .4s; pointer-events:none; max-width:88vw; text-align:center; }
  #errbox { position:fixed; bottom:8px; left:8px; right:8px; z-index:99;
    color:#f99; font:12px monospace; background:rgba(0,0,0,.85);
    border:1px solid #a33; border-radius:3px; padding:8px;
    white-space:pre-wrap; display:none; max-height:30vh; overflow:auto; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="hudbtns">
      <button id="btnPause" aria-label="Пауза">⏸</button>
      <button id="btnHome" aria-label="В меню">⌂</button>
    </div>
    <canvas id="game" width="800" height="600"></canvas>
  </div>
  <div id="overlay"><div id="panel"></div></div>
</div>
<div id="toast"></div>
<div id="errbox"></div>
<script>
"use strict";
// ---------- видимые ошибки (для отладки в APK) ----------
window.addEventListener('error', function (e) {
  var box = document.getElementById('errbox');
  if (box) { box.style.display='block'; box.textContent='Ошибка: ' + (e.message||e.error); }
});

// ---------- безопасное хранилище ----------
var store = (function () {
  try {
    var t='__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    return { get:function(k){return localStorage.getItem(k);},
             set:function(k,v){localStorage.setItem(k,v);} };
  } catch (e) {
    var mem={};
    return { get:function(k){return (k in mem)?mem[k]:null;},
             set:function(k,v){mem[k]=String(v);} };
  }
})();

try {

var cv = document.getElementById('game'), ctx = cv.getContext('2d');
var W = 800, H = 600;
var overlay = document.getElementById('overlay'), panel = document.getElementById('panel');
var toastEl = document.getElementById('toast');

// вписываем поле в экран
function fitCanvas() {
  var s = Math.min(window.innerWidth/W, (window.innerHeight - 80)/H);
  cv.style.width = Math.floor(W*s)+'px'; cv.style.height = Math.floor(H*s)+'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', function(){ setTimeout(fitCanvas,100); });
fitCanvas();

// ---------- звук ----------
var actx = null;
var volume = +(store.get('neonVolume')||50);
if (volume < 0 || volume > 100 || isNaN(volume)) volume = 50;
var soundOn = store.get('neonSound') !== 'off';
function beep(freq, dur, type, vol) {
  dur = dur||0.08; type = type||'square'; vol = vol||0.12;
  if (!soundOn || volume <= 0) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol * (volume/100), actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

// ---------- экономика, скины, темы ----------
var coins = +(store.get('neonCoins')||0);
function saveCoins() { store.set('neonCoins', coins); }

var SKINS_P = [
  { id:'p1', n:'Кибер',    cost:0,   c:'#0ff' },
  { id:'p2', n:'Пламя',    cost:100, c:'#f62' },
  { id:'p3', n:'Токсин',   cost:200, c:'#7f5' },
  { id:'p4', n:'Аметист',  cost:350, c:'#b6f' },
  { id:'p5', n:'Золото',   cost:600, c:'#fc0' },
  { id:'p6', n:'Лёд',      cost:450, c:'#9cf' },
  { id:'p7', n:'Роза',     cost:800, c:'#f7a' },
  { id:'p8', n:'Изумруд',  cost:1000, c:'#2f9' },
  { id:'p_crown', n:'Корона', cost:0, c:'#ffd700', pass:true }
];
var SKINS_B = [
  { id:'b1', n:'Комета',   cost:0,   c:'#fff' },
  { id:'b2', n:'Марс',     cost:120, c:'#f55' },
  { id:'b3', n:'Лайм',     cost:250, c:'#8f5' },
  { id:'b4', n:'Магента',  cost:400, c:'#f4e' },
  { id:'b5', n:'Солнце',   cost:700, c:'#ff0' },
  { id:'b6', n:'Лёд',      cost:550, c:'#8ef' },
  { id:'b7', n:'Космос',   cost:900, c:'#a7f' },
  { id:'b8', n:'Ядро',     cost:1200, c:'#f80' },
  { id:'b_phoenix', n:'Феникс', cost:0, c:'#f84', pass:true }
];
var THEMES = [
  { id:'t1', n:'Ночные огни', cost:0,
    a:'#0d0a24', b:'#170a2e', c:'#0a1630', grid:'rgba(180,120,255,.08)' },
  { id:'t2', n:'Вулкан', cost:300,
    a:'#1a0a08', b:'#2e0f14', c:'#16060c', grid:'rgba(255,140,80,.07)' },
  { id:'t3', n:'Глубина', cost:300,
    a:'#061022', b:'#0a2030', c:'#061a26', grid:'rgba(80,200,255,.07)' },
  { id:'t4', n:'Кислота', cost:500,
    a:'#0a1408', b:'#12260e', c:'#061a10', grid:'rgba(140,255,80,.07)' },
  { id:'t5', n:'Мята', cost:650,
    a:'#062018', b:'#0c3024', c:'#041a12', grid:'rgba(80,255,180,.07)' },
  { id:'t6', n:'Закат', cost:650,
    a:'#1c0a20', b:'#301224', c:'#180818', grid:'rgba(255,120,180,.07)' },
  { id:'t_pass', n:'Пасс', cost:0,
    a:'#1a1206', b:'#2e2210', c:'#1a1208', grid:'rgba(255,215,0,.08)', pass:true }
];
var ownedArr = (store.get('neonOwned')||'p1,b1,t1').split(',');
var owned = {};
for (var oi=0; oi<ownedArr.length; oi++) if (ownedArr[oi]) owned[ownedArr[oi]] = true;
var eqP = store.get('neonEqP')||'p1';
var eqB = store.get('neonEqB')||'b1';
var eqT = store.get('neonEqT')||'t1';
function saveCosmetics() {
  store.set('neonOwned', Object.keys(owned).join(','));
  store.set('neonEqP', eqP); store.set('neonEqB', eqB); store.set('neonEqT', eqT);
}
function skinP() { for (var i=0;i<SKINS_P.length;i++) if (SKINS_P[i].id===eqP) return SKINS_P[i]; return SKINS_P[0]; }
function skinB() { for (var i=0;i<SKINS_B.length;i++) if (SKINS_B[i].id===eqB) return SKINS_B[i]; return SKINS_B[0]; }
function theme() { for (var i=0;i<THEMES.length;i++) if (THEMES[i].id===eqT) return THEMES[i]; return THEMES[0]; }

// ---------- профиль ----------
var profile = { name:'', av:'🐱', col:'#FF8A00' };
try {
  var pr = JSON.parse(store.get('neonProfile')||'null');
  if (pr && pr.name !== undefined) profile = pr;
} catch (e) {}
function saveProfile() { store.set('neonProfile', JSON.stringify(profile)); }
function profHTML() {
  return '<span class="profName" style="color:' + profile.col + ';">' +
    (profile.name ? profile.av + ' ' + profile.name : '') + '</span>' +
    (passActive() ? ' <span class="profName" style="color:#ffd700;">⚡PASS</span>' : '');
}

// ---------- промокоды ----------
// ВШИТЫЕ ПРОМОКОДЫ: замените [] на строку из dev-панели,
// например: var BUILTIN_PROMOS = [{code:'NB-4F7K-9Q2M',coins:100}];
var BUILTIN_PROMOS = [];
var PROMOS = loadPromos();
function loadPromos() {
  try {
    var arr = JSON.parse(store.get('neonPromos')||'[]');
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function savePromos() { store.set('neonPromos', JSON.stringify(PROMOS)); }
function findPromo(code) {
  code = code.trim().toUpperCase();
  var lists = [PROMOS, BUILTIN_PROMOS];
  for (var L = 0; L < lists.length; L++)
    for (var i = 0; i < lists[L].length; i++)
      if (lists[L][i].code === code) return lists[L][i];
  return null;
}

// ---------- бонусы: стрик, сундуки, боевой пропуск, NEON PASS ----------
function todayStr() { return new Date().toDateString(); }

// --- NEON PASS (подписка) ---
function passUntil() { return +(store.get('neonPassUntil') || 0); }
function passActive() { return Date.now() < passUntil(); }
function passDaysLeft() { return Math.max(0, Math.ceil((passUntil() - Date.now()) / 86400000)); }
function coinMult() { return passActive() ? 1.5 : 1; }

// --- ежедневная награда (стрик) ---
var STREAK_REWARDS = [50, 75, 100, 150, 200, 300, 500];
function streakState() {
  var last = store.get('neonStreakLast') || '';
  var cnt = +(store.get('neonStreakCount') || 0);
  var today = todayStr();
  if (last !== today) {
    if (last) {
      var y = new Date(); y.setDate(y.getDate() - 1);
      if (last !== y.toDateString()) cnt = 0;
    }
    return { can: true, cnt: cnt };
  }
  return { can: false, cnt: cnt };
}
function claimStreak() {
  var st = streakState();
  if (!st.can) return;
  var reward = STREAK_REWARDS[st.cnt % 7];
  if (passActive()) reward *= 2;
  store.set('neonStreakLast', todayStr());
  store.set('neonStreakCount', st.cnt + 1);
  coins += reward; saveCoins();
  showToast('День ' + (st.cnt + 1) + ' · +' + reward + ' монет' + (passActive() ? ' (PASS ×2)' : ''));
  beep(1200, .15, 'sine', .16);
  showBonusUI();
}

// --- сундуки ---
var CHEST_PRIZES = {
  free:   [10, 20, 30, 40, 50, 75, 100, 250],
  silver: [20, 40, 60, 80, 100, 150, 300, 500],
  gold:   [50, 100, 200, 300, 400, 500, 1000, 2000]
};
function chestReady(kind) {
  var last = store.get('neonChest_' + kind);
  return !last || last !== todayStr();
}
function openChest(kind) {
  if (!chestReady(kind)) { showToast('Этот сундук откроется завтра'); return; }
  var cost = kind === 'silver' ? 100 : kind === 'gold' ? 300 : 0;
  if (coins < cost) { showToast('Не хватает монет: нужно ' + cost); beep(160, .2, 'sawtooth'); return; }
  coins -= cost; saveCoins();
  store.set('neonChest_' + kind, todayStr());
  var prizes = CHEST_PRIZES[kind];
  var title = kind === 'gold' ? 'ЗОЛОТОЙ СУНДУК' : kind === 'silver' ? 'СЕРЕБРЯНЫЙ СУНДУК' : 'БЕСПЛАТНЫЙ СУНДУК';
  var cells = '';
  for (var ci = 0; ci < prizes.length; ci++)
    cells += '<div id="ch' + ci + '" class="btn" style="flex:0 0 72px;text-align:center;padding:10px 2px;">+' + prizes[ci] + '</div>';
  panel.innerHTML =
    '<h2>' + title + '</h2>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px;max-width:340px;margin:14px auto;justify-content:center;">' + cells + '</div>' +
    '<p class="small" id="chestMsg">Крутим...</p>';
  overlay.classList.remove('hidden');
  var steps = 0, total = 22, idx = 0, delay = 90;
  function step() {
    for (var i = 0; i < prizes.length; i++) {
      var el = document.getElementById('ch' + i);
      if (el) el.style.background = 'rgba(255,255,255,.06)';
    }
    var cur = document.getElementById('ch' + (idx % prizes.length));
    if (cur) cur.style.background = 'rgba(255,138,0,.55)';
    idx++; steps++;
    if (steps < total) { delay += 14; setTimeout(step, delay); }
    else {
      var win = prizes[(idx - 1) % prizes.length];
      coins += win; saveCoins();
      var m = document.getElementById('chestMsg');
      if (m) m.innerHTML = 'Приз: <b>+' + win + '</b> монет!';
      showToast('+' + win + ' монет из сундука');
      beep(1047, .2, 'triangle', .2);
      var back = document.createElement('button');
      back.className = 'btn primary'; back.textContent = 'ОТЛИЧНО';
      back.style.marginTop = '10px';
      back.onclick = function () { showMenu('bonus'); };
      panel.appendChild(back);
    }
  }
  setTimeout(step, delay);
}

// --- боевой пропуск ---
var PASS_LEN = 30 * 86400000;
var PASS_LEVELS = 20, PASS_XP = 50;
var PASS_FREE_COINS = [20, 25, 30, 35, 40, 45, 50, 55, 60, 70, 75, 80, 90, 100, 110, 120, 130, 150, 200, 300];
var PASS_PREMIUM_ITEMS = { 5: 'b_phoenix', 12: 't_pass', 20: 'p_crown' };
function passSeason() {
  try {
    var o = JSON.parse(store.get('neonBp') || 'null');
    if (o && o.start) return o;
  } catch (e) {}
  return null;
}
function passActiveSeason() {
  var s = passSeason();
  return s && (Date.now() - s.start) < PASS_LEN ? s : null;
}
function bpLevel() { var s = passActiveSeason(); return s ? Math.min(PASS_LEVELS, Math.floor(s.xp / PASS_XP)) : 0; }
function bpProgress() { var s = passActiveSeason(); return s ? (s.xp % PASS_XP) : 0; }
function bpGotList() {
  return (store.get('neonBpGot') || '').split(',').filter(function (x) { return x; });
}
function startSeason() {
  if (passActiveSeason()) { showToast('Сезон уже идёт'); return; }
  store.set('neonBp', JSON.stringify({ start: Date.now(), xp: 0, premium: false }));
  store.set('neonBpGot', '');
  showToast('Сезон запущен! 30 дней, 20 уровней');
  beep(1047, .2, 'triangle', .2);
  showBonusUI();
}
function buyPremium() {
  var s = passActiveSeason();
  if (!s) { showToast('Сначала начни сезон'); return; }
  if (s.premium) { showToast('Премиум уже активен'); return; }
  if (coins < 700) { showToast('Не хватает монет: нужно 700'); beep(160, .2, 'sawtooth'); return; }
  coins -= 700; saveCoins();
  s.premium = true;
  store.set('neonBp', JSON.stringify(s));
  var got = bpGotList(), lv = bpLevel();
  for (var k in PASS_PREMIUM_ITEMS) {
    if (+k <= lv && got.indexOf(PASS_PREMIUM_ITEMS[k]) < 0) {
      got.push(PASS_PREMIUM_ITEMS[k]);
      owned[PASS_PREMIUM_ITEMS[k]] = true;
    }
  }

var WHEEL_WEIGHTS = [30, 22, 15, 11, 8, 5, 2, 0.8];
var WHEEL_COLORS = ['#7a1030', '#2a1570', '#0a6a80', '#5a0a2a', '#7a6a10', '#2a1a80', '#0a5a70', '#7a3a08'];
var WHEEL_EDGE = ['#ff2d78', '#8b5cf6', '#22d3ee', '#ff2d78', '#ffd700', '#8b5cf6', '#22d3ee', '#ff8c1a'];

function drawWheel(cv, rot) {
  var ctx = cv.getContext('2d');
  var W = cv.width, cx = W / 2, cy = W / 2, R = W / 2 - 16;
  ctx.clearRect(0, 0, W, W);
  ctx.beginPath(); ctx.arc(cx, cy, R + 9, 0, Math.PI * 2);
  ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 7;
  ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 20;
  ctx.stroke(); ctx.shadowBlur = 0;
  for (var i = 0; i < 8; i++) {
    var a0 = rot + i * Math.PI / 4 - Math.PI / 2, a1 = a0 + Math.PI / 4;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[i]; ctx.fill();
    ctx.strokeStyle = WHEEL_EDGE[i]; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + Math.PI / 8);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px "Segoe UI",sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 4;
    ctx.fillText(WHEEL_PRIZES[i], R * 0.62, 11); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = '#0d0b1e'; ctx.fill();
  ctx.strokeStyle = '#ff2d78'; ctx.lineWidth = 5;
  ctx.shadowColor = '#ff2d78'; ctx.shadowBlur = 14;
  ctx.stroke(); ctx.shadowBlur = 0;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px "Segoe UI",sans-serif';
  ctx.fillText('NEON', cx, cy - 6);
  ctx.fillStyle = '#ffd700'; ctx.fillText('SPIN', cx, cy + 28);
  ctx.beginPath(); ctx.moveTo(cx - 15, 4); ctx.lineTo(cx + 15, 4); ctx.lineTo(cx, 34); ctx.closePath();
  ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
}

function spinWheelFree() {
  if (wheelSpin || wheelUsedToday()) return;
  wheelSpin = true;
  store.set('neonWheelDate', new Date().toDateString());
  var btn = document.getElementById('rwSpin'); if (btn) btn.disabled = true;
  var tot = 0, i;
  for (i = 0; i < 8; i++) tot += WHEEL_WEIGHTS[i];
  var r = Math.random() * tot, idx = 0;
  for (i = 0; i < 8; i++) { if (r < WHEEL_WEIGHTS[i]) { idx = i; break; } r -= WHEEL_WEIGHTS[i]; }
  var from = wheelRot, TAU = Math.PI * 2;
  var shift = ((TAU - (idx * Math.PI / 4 + Math.PI / 8) - (from % TAU)) % TAU + TAU) % TAU;
  var end = from + TAU * 5 + shift;
  var t0 = performance.now(), dur = 4200;
  function fr(t) {
    var p = Math.min(1, (t - t0) / dur);
    p = 1 - Math.pow(1 - p, 3);
    var cur = from + (end - from) * p;
    var c2 = document.getElementById('wheelCv');
    if (!c2) { coins += WHEEL_PRIZES[idx]; saveCoins(); wheelSpin = false; return; }
    drawWheel(c2, cur);
    if (p < 1) { requestAnimationFrame(fr); return; }
    wheelRot = cur % TAU;
    coins += WHEEL_PRIZES[idx]; saveCoins();
    showToast('Выигрыш: +' + WHEEL_PRIZES[idx] + ' монет!');
    beep(1200, .25, 'sine', .2);
    wheelSpin = false;
    var b = document.getElementById('rwSpin');
    if (b) b.disabled = true;
  }
  requestAnimationFrame(fr);
}

  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

}

// ---------- генерация уровней ----------
function isBossLevel(n) { return n % 10 === 0; }
function makeLevel(n, rng) {
  bricks = []; boss = null;
  var R = rng || Math.random;
  var d = DIFFS[diffKey];
  var cols = 10, gap = 6;
  var bw = (W - 60 - (cols - 1) * gap) / cols, bh = 26;
  var rows = Math.min(4 + Math.floor((n - 1) / 12), isBossLevel(n) ? 4 : 8);
  var pattern = Math.floor(R() * 6);
  var baseHp = Math.min(1 + Math.floor((n - 1) / 14), d.maxHp);
  for (var r = 0; r < rows; r++)
    for (var c = 0; c < cols; c++) {
      if (pattern === 1 && (r + c) % 2 === 1) continue;
      if (pattern === 2 && Math.abs(c - (cols - 1) / 2) > r) continue;
      if (pattern === 3 && c % 2 === 1 && r !== 0) continue;
      if (pattern === 4 && (r + c) % 3 === 1) continue;
      if (pattern === 5 && R() < 0.15) continue;
      var hp = baseHp + (r < 2 ? 1 : 0);
      hp = Math.min(hp, d.maxHp);
      bricks.push({ x: 30 + c * (bw + gap), y: 70 + r * (bh + gap),
                    w: bw, h: bh, hp: hp, color: HP_COLORS[hp] });
    }
  if (isBossLevel(n)) {
    boss = { x: W/2 - 70, y: 180, w: 140, h: 40, vx: 1.6 + n * 0.05,
             hp: 8 + Math.floor(n / 2), maxHp: 8 + Math.floor(n / 2), t: 0 };
  }
  if (!bricks.length && !boss) makeLevel(n - 1, rng);
}

function startGame(fromLevel) {
  isDaily = false;
  var from = fromLevel || 1;
  if (from === 1) clearRun();
  var saved = (from > 1) ? loadRun() : null;
  level = from;
  score = (saved && saved.lv === from) ? (saved.sc || 0) : 0;
  lives = (saved && saved.lv === from && saved.li > 0) ? saved.li : DIFFS[diffKey].lives;
  combo = 0;
  expandT = 0; slowT = 0; drops = []; particles = [];
  resetPaddle(); makeLevel(level);
  balls = [newBall()];
  state = 'ready';
  hideOverlay();
}
function startDaily() {
  if (!dailyAvailable()) {
    showToast(dailyDone() ? 'Вызов уже пройден — возвращайтесь завтра!'
                          : 'Следующая попытка через ' + dailyRemaining());
    beep(160, .2, 'sawtooth');
    return;
  }
  isDaily = true;
  diffKey = 'normal';
  level = Math.min(getProgress(), 20);
  score = 0; lives = 1; combo = 0;
  expandT = 0; slowT = 0; drops = []; particles = [];
  resetPaddle(); makeLevel(level, mulberry32(dailySeed()));
  balls = [newBall()];
  state = 'ready';
  hideOverlay();
}

function launch() {
  var b = balls[0];
  if (!b || !b.stuck) return;
  b.stuck = false;
  state = 'play';
  var a = -Math.PI/2 + (Math.random() * 0.9 - 0.45);
  b.vx = Math.cos(a) * b.speed;
  b.vy = -Math.abs(Math.sin(a)) * b.speed;
  beep(880, .07, 'square');
}

var PU = [
  { k:'E', c:'#0f0' },   // широкая платформа
  { k:'M', c:'#ff0' },   // двойной шар
  { k:'S', c:'#0ff' },   // замедление
  { k:'L', c:'#f0f' }    // жизнь
];
function spawnDrop(x, y) {
  var d = DIFFS[diffKey];
  if (Math.random() > (isDaily ? 0.12 : d.drop)) return;
  var w = PU[Math.floor(Math.random() * PU.length)];
  drops.push({ x: x - 14, y: y, w: 28, h: 28, pu: w, vy: 2.6 });
}
function applyPU(p) {
  beep(1200, .12, 'sine', .16);
  flash = 8;
  if (p.k === 'E') expandT = 60 * 12;
  if (p.k === 'S') slowT = 60 * 8;
  if (p.k === 'L') lives = Math.min(lives + 1, 6);
  if (p.k === 'M') {
    var src = [];
    for (var i=0;i<balls.length;i++) if (!balls[i].stuck) src.push(balls[i]);
    for (var j=0;j<src.length&&j<2;j++) {
      if (balls.length > 5) break;
      balls.push({ x: src[j].x, y: src[j].y, vx: -src[j].vx || 2, vy: src[j].vy || -4,
                   r: 8, speed: src[j].speed, bossCd: 0, trail: [], stuck: false });
    }
  }
}

// ---------- частицы ----------
function burst(x, y, color, n) {
  n = n || 12;
  for (var i=0;i<n;i++) {
    var a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3.5;
    particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color:color });
  }
}

// ---------- логика ----------
function update() {
  var cx = paddle.target - paddle.w/2;
  paddle.x += (cx - paddle.x) * 0.35;
  paddle.x = Math.max(4, Math.min(W - paddle.w - 4, paddle.x));
  paddle.w += ((expandT > 0 ? 210 : paddle.baseW) - paddle.w) * 0.2;

  if (expandT > 0) expandT--;
  if (slowT > 0) slowT--;
  if (flash > 0) flash--;
  if (shake > 0) shake *= 0.88;

  var ts = slowT > 0 ? 0.55 : 1;

  // босс
  if (boss) {
    boss.t++;
    boss.x += boss.vx * ts;
    if (boss.x < 10) { boss.x = 10; boss.vx = Math.abs(boss.vx); }
    if (boss.x + boss.w > W - 10) { boss.x = W - 10 - boss.w; boss.vx = -Math.abs(boss.vx); }
    if (boss.t % 240 === 0 && state === 'play')
      drops.push({ x: boss.x + boss.w/2 - 14, y: boss.y + boss.h, w: 28, h: 28,
                   pu: PU[Math.floor(Math.random()*PU.length)], vy: 2.2 });
  }

  for (var bi=0; bi<balls.length; bi++) {
    var b = balls[bi];
    if (b.stuck) { b.x = paddle.x + paddle.w/2; b.y = paddle.y - 12; continue; }
    b.x += b.vx * ts; b.y += b.vy * ts;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 8) b.trail.shift();
    if (b.bossCd > 0) b.bossCd--;

    if (b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) { b.dead = true; continue; }

    if (b.x < b.r)      { b.x = b.r;      b.vx =  Math.abs(b.vx); beep(300,.04); }
    if (b.x > W - b.r)  { b.x = W - b.r;  b.vx = -Math.abs(b.vx); beep(300,.04); }
    if (b.y < b.r + 46) { b.y = b.r + 46; b.vy =  Math.abs(b.vy); beep(300,.04); }

    // шар не может зависнуть в почти горизонтальном полёте
    var minVy = b.speed * 0.25;
    if (Math.abs(b.vy) < minVy) b.vy = (b.vy < 0 ? -1 : 1) * minVy;

    // платформа
    if (b.vy > 0 &&
        b.x > paddle.x - b.r && b.x < paddle.x + paddle.w + b.r &&
        b.y + b.r > paddle.y && b.y - b.r < paddle.y + paddle.h) {
      var hit = (b.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      var sp = Math.hypot(b.vx, b.vy);
      var ang = -Math.PI/2 + hit * 1.0;
      b.vx = Math.cos(ang) * sp;
      b.vy = Math.sin(ang) * sp;
      b.y = paddle.y - b.r;
      combo = 0;
      beep(220, .05, 'sine');
    }

    // столкновение с боссом
    if (boss && b.bossCd <= 0 &&
        b.x + b.r > boss.x && b.x - b.r < boss.x + boss.w &&
        b.y + b.r > boss.y && b.y - b.r < boss.y + boss.h) {
      var oL = b.x + b.r - boss.x, oR = boss.x + boss.w - (b.x - b.r);
      var oT = b.y + b.r - boss.y, oB = boss.y + boss.h - (b.y - b.r);
      var m = Math.min(oL, oR, oT, oB);
      if (m === oT || m === oB) b.vy = -b.vy; else b.vx = -b.vx;
      boss.hp--; b.bossCd = 12;
      score += 50; burst(b.x, b.y, '#f44', 14);
      shake = 8; beep(180, .1, 'sawtooth', .15);
      if (boss.hp <= 0) {
        coins += Math.round(50 * coinMult()); saveCoins();
        burst(boss.x + boss.w/2, boss.y + boss.h/2, '#f44', 40);
        boss = null; shake = 14;
        unlockAch('a5');
        addPassXP(100);
        showToast('Босс повержен! +50 монет');
        beep(1047,.25,'triangle',.2);
      }
      continue;
    }

    // кирпичи
    for (var ki=0; ki<bricks.length; ki++) {
      var br = bricks[ki];
      if (br.hp <= 0) continue;
      if (b.x + b.r < br.x || b.x - b.r > br.x + br.w ||
          b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;
      var oL2 = b.x + b.r - br.x, oR2 = br.x + br.w - (b.x - b.r);
      var oT2 = b.y + b.r - br.y, oB2 = br.y + br.h - (b.y - b.r);
      var m2 = Math.min(oL2, oR2, oT2, oB2);
      if (m2 === oT2 || m2 === oB2) b.vy = -b.vy; else b.vx = -b.vx;
      br.hp--;
      score += 10 + combo * 5;
      combo++;
      if (combo >= 10) unlockAch('a4');
      burst(b.x, b.y, br.color, 10);
      beep(400 + combo * 30, .06, 'square', .1);
      if (br.hp <= 0) {
        coins++; saveCoins();
        spawnDrop(br.x + br.w/2, br.y + br.h/2);
        shake = 6;
      }
      break;
    }

    if (b.y > H + 30) b.dead = true;
  }
  var alive = [];
  for (var bj=0; bj<balls.length; bj++) if (!balls[bj].dead) alive.push(balls[bj]);
  balls = alive;

  // потеря жизни
  if (balls.length === 0 && (state === 'play' || state === 'ready')) {
    lives--; combo = 0;
    beep(120, .3, 'sawtooth', .2);
    if (lives <= 0) gameOver();
    else { balls = [newBall()]; state = 'ready'; }
  }

  // бонус-капли
  for (var di=0; di<drops.length; di++) {
    var d = drops[di];
    d.y += d.vy * ts;
    if (d.y > paddle.y && d.y < paddle.y + paddle.h + 10 &&
        d.x + d.w > paddle.x && d.x < paddle.x + paddle.w) {
      applyPU(d.pu); d.got = true;
      burst(d.x + d.w/2, d.y, d.pu.c, 16);
    }
  }
  var kept = [];
  for (var dj=0; dj<drops.length; dj++)
    if (!drops[dj].got && drops[dj].y < H + 30) kept.push(drops[dj]);
  drops = kept;

  // частицы
  for (var pi=0; pi<particles.length; pi++) {
    var p = particles[pi];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.03;
  }
  var ps = [];
  for (var pj=0; pj<particles.length; pj++) if (particles[pj].life > 0) ps.push(particles[pj]);
  particles = ps;

  // уровень пройден
  var anyBrick = false;
  for (var bi2=0; bi2<bricks.length; bi2++) if (bricks[bi2].hp > 0) { anyBrick = true; break; }

  if (state === 'play' && !anyBrick && !boss) {
    score += 100 + level * 10;
    coins += Math.round((20 + level * 2) * coinMult()); saveCoins();
    beep(523,.1,'triangle'); setTimeout(function () { beep(784,.15,'triangle'); }, 120);
    unlockAch('a1');
    if (level >= 10) unlockAch('a2');
    if (level >= 25) unlockAch('a3');
    if (coins >= 500) unlockAch('a7');
    addPassXP(30);

    if (isDaily) {
      var dBest = +(store.get('neonDaily')||0);
      if (score > dBest) store.set('neonDaily', score);
      if (!dailyDone()) {
        store.set('neonDailyDate', new Date().toDateString());
        coins += 100; saveCoins(); unlockAch('a6');
        addPassXP(150);
        showToast('Ежедневный вызов пройден! +100 монет');
      }
      state = 'over';
      showDailyResult(true);
      return;
    }
    if (level >= TOTAL_LEVELS) { winGame(); return; }
    setProgress(Math.max(getProgress(), level + 1));
    level++;
    makeLevel(level);
    balls = [newBall()];
    drops = []; state = 'ready';
  }
}

// ---------- отрисовка ----------
function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  var th = theme();
  if (bgGradId !== th.id) {
    bgGrad = ctx.createLinearGradient(0,0,0,H);
    bgGrad.addColorStop(0, th.a); bgGrad.addColorStop(0.55, th.b); bgGrad.addColorStop(1, th.c);
    bgGradId = th.id;
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle = th.grid; ctx.lineWidth = 1;
  for (var x=0; x<W; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (var y=0; y<H; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // кирпичи
  for (var i=0; i<bricks.length; i++) {
    var br = bricks[i];
    if (br.hp <= 0) continue;
    ctx.shadowColor = br.color; ctx.shadowBlur = 12;
    ctx.fillStyle = br.color;
    ctx.globalAlpha = 0.35 + br.hp * 0.15;
    roundRect(br.x, br.y, br.w, br.h, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.strokeStyle = br.color; ctx.lineWidth = 2;
    roundRect(br.x, br.y, br.w, br.h, 5); ctx.stroke();
    if (br.hp >= 3) {
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(br.hp, br.x + br.w/2, br.y + br.h/2 + 1);
    }
  }

  // босс
  if (boss) {
    var bp = boss.hp / boss.maxHp;
    ctx.shadowColor = '#f44'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#f44'; ctx.globalAlpha = 0.5 + bp * 0.5;
    roundRect(boss.x, boss.y, boss.w, boss.h, 8); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    ctx.strokeStyle = '#f88'; ctx.lineWidth = 3;
    roundRect(boss.x, boss.y, boss.w, boss.h, 8); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('БОСС ' + boss.hp, boss.x + boss.w/2, boss.y + boss.h/2);
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fillRect(boss.x, boss.y - 12, boss.w, 6);
    ctx.fillStyle = '#f44';
    ctx.fillRect(boss.x, boss.y - 12, boss.w * bp, 6);
    var anyBr = false;
    for (var k=0; k<bricks.length; k++) if (bricks[k].hp > 0) { anyBr = true; break; }
    if (!anyBr) {
      ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,120,120,' + (0.55 + 0.45*Math.sin(Date.now()/250)) + ')';
      ctx.fillText('ОСТАЛОСЬ СЛОМАТЬ БОССА!', W/2, 120);
    }
  }

  // капли бонусов
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 18px monospace';
  for (var d1=0; d1<drops.length; d1++) {
    var dd = drops[d1];
    ctx.shadowColor = dd.pu.c; ctx.shadowBlur = 14;
    ctx.strokeStyle = dd.pu.c; ctx.lineWidth = 2;
    roundRect(dd.x, dd.y, dd.w, dd.h, 7); ctx.stroke();
    ctx.fillStyle = dd.pu.c; ctx.fillText(dd.pu.k, dd.x + dd.w/2, dd.y + dd.h/2 + 1);
    ctx.shadowBlur = 0;
  }

  // частицы
  for (var p1=0; p1<particles.length; p1++) {
    var pp = particles[p1];
    ctx.globalAlpha = pp.life;
    ctx.fillStyle = pp.color;
    ctx.fillRect(pp.x - 2, pp.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // платформа (цвет — из скина)
  ctx.shadowColor = skinP().c; ctx.shadowBlur = 18;
  ctx.fillStyle = skinP().c;
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
  ctx.shadowBlur = 0;

  // шары с хвостом
  for (var b2=0; b2<balls.length; b2++) {
    var bb = balls[b2];
    for (var ti=0; ti<bb.trail.length; ti++) {
      var t = bb.trail[ti];
      ctx.globalAlpha = (ti / bb.trail.length) * 0.35;
      ctx.fillStyle = skinB().c;
      ctx.beginPath(); ctx.arc(t.x, t.y, bb.r * (ti / bb.trail.length) * 0.9, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowColor = skinB().c; ctx.shadowBlur = 16;
    ctx.fillStyle = skinB().c;
    ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // HUD
  ctx.font = 'bold 20px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 8;
  ctx.fillText('СЧЁТ ' + score, 20, 30);
  ctx.fillStyle = '#888'; ctx.shadowColor = '#888';
  ctx.fillText('РЕКОРД ' + Math.max(best, score), 175, 30);
  ctx.fillStyle = '#f0f'; ctx.shadowColor = '#f0f';
  ctx.fillText(isDaily ? 'ВЫЗОВ' : 'УР. ' + level + '/' + TOTAL_LEVELS, 345, 30);
  ctx.fillStyle = '#fc0'; ctx.shadowColor = '#fc0';
  ctx.fillText(coins + ' МОНЕТ', 470, 30);
  // сложность — справа от надписи монет, рядом с жизнями
  ctx.font = 'bold 14px monospace';
  var diffColor = DIFFS[diffKey].name === 'ЛЁГКИЙ' ? '#7f5'
                : (DIFFS[diffKey].name === 'СЛОЖНЫЙ' ? '#f6a' : '#fa0');
  ctx.fillStyle = diffColor; ctx.shadowColor = diffColor; ctx.shadowBlur = 8;
  var lifeLeft = W - 24 - (lives - 1) * 22 - 7;   // левая точка жизней
  ctx.textAlign = 'right';
  ctx.fillText(DIFFS[diffKey].name, lifeLeft - 14, 30);
  ctx.textAlign = 'left';
  ctx.shadowBlur = 0;
  for (var li=0; li<lives; li++) {
    ctx.fillStyle = '#f0f'; ctx.shadowColor = '#f0f'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(W - 24 - li * 22, 24, 7, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
  }
  if (combo > 2) {
    ctx.fillStyle = '#ff0'; ctx.shadowColor = '#ff0'; ctx.shadowBlur = 10;
    ctx.textAlign = 'center'; ctx.font = 'bold 20px monospace';
    ctx.fillText('КОМБО x' + combo, W/2, 30);
    ctx.shadowBlur = 0;
  }
  if (slowT > 0 || expandT > 0) {
    ctx.font = '14px monospace'; ctx.textAlign = 'right';
    ctx.fillStyle = '#0f8';
    var list2 = [];
    if (expandT > 0) list2.push('ШИРИНА ' + Math.ceil(expandT/60) + 'с');
    if (slowT > 0)   list2.push('ЗАМЕДЛЕНИЕ ' + Math.ceil(slowT/60) + 'с');
    ctx.fillText(list2.join('  '), W - 20, 56);
  }

  if (state === 'ready') {
    ctx.font = '16px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(232,246,255,' + (0.5 + 0.5*Math.sin(Date.now()/300)) + ')';
    ctx.fillText('ПРОБЕЛ ИЛИ КЛИК — ЗАПУСК', W/2, H - 90);
  }

  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash/60 + ')'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- главный цикл ----------
function loop() {
  if (state === 'play' || state === 'ready') update();
  draw();
  requestAnimationFrame(loop);
}
resetPaddle(); balls = []; bricks = []; drops = []; particles = [];
showMenu('play');
loop();

} catch (initErr) {
  var box = document.getElementById('errbox');
  if (box) { box.style.display='block'; box.textContent='Ошибка: ' + initErr.message; }
}
</script>
